name: lt_operations
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 1. Offline Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 2. Barcode Scanning
  mobile_scanner: ^3.5.5

  # 3. Excel File Generate
  excel: ^4.0.2

  # 4. UI ko Image (PNG) me convert
  screenshot: ^3.0.0

  # 5. Digital Signature
  signature: ^5.4.0

  # 6. WhatsApp open & files save
  url_launcher: ^6.2.1
  path_provider: ^2.1.1
  permission_handler: ^11.1.0
  share_plus: ^7.2.1
  file_picker: ^6.1.1
  image: ^4.1.7
  image_picker: ^1.0.4

  # 7. PDF Generate
  pdf: ^3.10.8

  # 8. Date aur Time format & API
  intl: ^0.18.1
  http: ^1.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

# App Icon Generator Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/letstransport_logo.jpeg"
  ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/letstransport_logo.jpeg"

flutter:
  uses-material-design: true

  # App me use hone wali images
  assets:
    - assets/letstransport_logo.jpeg